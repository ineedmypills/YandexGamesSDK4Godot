<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Solid, Deep Indigo-Slate Background Gradient -->
    <linearGradient id="bgSolid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231b42"/>
      <stop offset="50%" stop-color="#181330"/>
      <stop offset="100%" stop-color="#100c22"/>
    </linearGradient>

    <!-- Godot Engine Blue Gradient -->
    <linearGradient id="godotBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ec0f8"/>
      <stop offset="100%" stop-color="#3d8ecf"/>
    </linearGradient>

    <!-- Warm Yandex Games Yellow Gamepad Gradient -->
    <linearGradient id="yandexYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fedb3e"/>
      <stop offset="100%" stop-color="#f5ab0d"/>
    </linearGradient>

    <!-- Natural Soft Coral-Red Button Gradient (Warm, matte 3D) -->
    <radialGradient id="redBtnMatte" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#f24d3e"/>
      <stop offset="60%" stop-color="#dc3123"/>
      <stop offset="100%" stop-color="#b81b0f"/>
    </radialGradient>

    <!-- Deep Ambient Drop Shadow for main silhouette -->
    <filter id="mainShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Soft Depth Shadow for Buttons -->
    <filter id="buttonShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#730e06" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Solid Premium Squircle Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgSolid)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Combined Silhouette with Drop Shadow -->
  <g filter="url(#mainShadow)">
    <!-- Top Antennas -->
    <rect x="36" y="19" width="8" height="13" rx="3" fill="url(#godotBlue)"/>
    <rect x="58" y="17" width="12" height="15" rx="3" fill="url(#godotBlue)"/>
    <rect x="84" y="19" width="8" height="13" rx="3" fill="url(#yandexYellow)"/>

    <!-- Left / Right Side Pegs -->
    <rect x="17" y="55" width="8" height="16" rx="3" fill="url(#godotBlue)"/>
    <rect x="103" y="55" width="8" height="16" rx="3" fill="url(#yandexYellow)"/>

    <!-- Left Half: Godot Robot Head -->
    <path d="M 28 35 
             L 64 35 
             L 64 97 
             L 32 97 
             A 12 12 0 0 1 20 85 
             L 20 43 
             A 8 8 0 0 1 28 35 Z" 
          fill="url(#godotBlue)"/>

    <!-- Right Half: Yandex Games Yellow Gamepad Face -->
    <path d="M 64 35 
             L 100 35 
             A 8 8 0 0 1 108 43 
             L 108 85 
             A 12 12 0 0 1 96 97 
             L 64 97 Z" 
          fill="url(#yandexYellow)"/>

    <!-- Center Divide Line -->
    <line x1="64" y1="35" x2="64" y2="97" stroke="#181c26" stroke-width="2" opacity="0.3"/>

    <!-- LEFT SIDE (Godot Face Features) -->
    <!-- Godot Eye Outer -->
    <circle cx="43" cy="61" r="11" fill="#ffffff"/>
    <!-- Godot Eye Pupil -->
    <circle cx="44" cy="62" r="6.5" fill="#1b202c"/>
    <!-- Godot Eye Catchlight -->
    <circle cx="41.5" cy="59" r="2.5" fill="#ffffff"/>

    <!-- Godot Mouth Notches -->
    <rect x="34" y="80" width="6" height="6" rx="2" fill="#1b202c"/>
    <rect x="44" y="80" width="6" height="6" rx="2" fill="#1b202c"/>

    <!-- RIGHT SIDE (Yandex Games Natural Matte 3D Buttons) -->
    <!-- Top Action Button -->
    <g filter="url(#buttonShadow)">
      <circle cx="85" cy="53" r="8.5" fill="url(#redBtnMatte)"/>
      <!-- Soft subtle top-left ambient sheen (no harsh white dots) -->
      <circle cx="83.5" cy="51.5" r="4.5" fill="#ffffff" opacity="0.18"/>
    </g>

    <!-- Bottom Action Button -->
    <g filter="url(#buttonShadow)">
      <circle cx="75" cy="74" r="8.5" fill="url(#redBtnMatte)"/>
      <!-- Soft subtle top-left ambient sheen (no harsh white dots) -->
      <circle cx="73.5" cy="72.5" r="4.5" fill="#ffffff" opacity="0.18"/>
    </g>

    <!-- D-Pad Mini Accent on bottom right -->
    <circle cx="95" cy="77" r="4.5" fill="#1b202c"/>
    <circle cx="95" cy="77" r="2" fill="#444b5c"/>
  </g>
</svg>
