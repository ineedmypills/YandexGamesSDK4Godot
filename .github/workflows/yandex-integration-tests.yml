name: Yandex integration tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Yandex integration tests
        env:
          YANDEX_BASE_URL: ${{ secrets.YANDEX_BASE_URL }}
          YANDEX_GAME_URL: ${{ secrets.YANDEX_GAME_URL }}
          YANDEX_GAME_ID: ${{ secrets.YANDEX_GAME_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_API_ENDPOINT: ${{ secrets.YANDEX_API_ENDPOINT }}
        run: npm run test:integration
